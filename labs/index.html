
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Chamado Técnico</title>
</head>

<body>

    <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend>Abrir Chamado Técnico</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
            <br><br>

            <label for="email">E-mail de Contato:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade" name="prioridade">
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>
            <br><br>

            <label for="anexo">Arquivo de Log ou Print (PNG/PDF):</label>
            <input type="file" id="anexo" name="anexo"
                accept="image/png,application/pdf" required>

            <small id="instrucao">Selecione um arquivo PNG ou PDF.</small>
            <br><br>

            <button type="submit">Enviar Chamado</button>

        </fieldset>

    </form>

</body>
</html>
